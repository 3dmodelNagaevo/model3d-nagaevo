name: Каталог из MAX → сайт

on:
  schedule:
    - cron: "*/5 * * * *"    # каждые 5 минут — чаще GitHub не позволяет (и может запускать с опозданием)
  workflow_dispatch:          # кнопка «Run workflow» — запустить вручную
  push:
    branches: [main]          # вы поменяли файлы сайта — сразу выкладываем
    paths-ignore: ["links.json", "promos.json"]   # библиотека ссылок сайт не меняет

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Сертификаты Минцифры (нужны для API MAX)
        run: |
          mkdir -p .certs
          curl -fsS --retry 3 https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o .certs/russian_root.crt || echo "корневой сертификат не скачался"
          curl -fsS --retry 3 https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt -o .certs/russian_sub.crt || echo "выпускающий сертификат не скачался"

      - name: Библиотеки для сжатия фото и QR
        run: pip install --quiet --disable-pip-version-check pillow qrcode || echo "без сжатия фото"

      - name: Забрать новые посты из канала и команды бота
        id: sync
        env:
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHANNEL_ID: ${{ vars.MAX_CHANNEL_ID }}
          OWNER_IDS: ${{ vars.OWNER_IDS }}
          METRIKA_ID: ${{ vars.METRIKA_ID }}
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
        run: python3 scripts/sync_max.py

      # сохраняем даже после ошибки: бот не должен выполнить команды повторно
      - name: Сохранить каталог
        id: save
        if: ${{ !cancelled() }}
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          for p in catalog.json state.json promos.json outbox.json access.json overrides.json sales.json reviews.json reviews channel_id.txt photos m qr sitemap.xml robots.txt; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # сайт пересобираем, только если поменялось что-то кроме служебного state.json
          if git diff --cached --name-only | grep -qv '^state.json$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          git commit -q -m "Каталог: обновление из канала MAX"
          # пока шёл запуск, бот в Yandex мог изменить overrides.json — подтягиваем и пушим
          git push || (git pull --rebase -q origin main && git push)

  deploy:
    needs: sync
    # выкладываем сайт, если каталог изменился или запуск был не по расписанию
    # (даже если MAX временно недоступен — правки сайта всё равно выйдут)
    if: ${{ !cancelled() && (needs.sync.outputs.changed == 'true' || github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      # на сайт идут только файлы сайта; служебные (продажи, состояние бота, код) остаются только в репозитории
      - name: Собрать файлы сайта
        run: |
          mkdir _site
          cp index.html config.js privacy.html catalog.json _site/
          for f in sitemap.xml robots.txt yandex_*.html google*.html; do if [ -f "$f" ]; then cp "$f" _site/; fi; done
          for d in img photos m qr; do [ -d "$d" ] && cp -r "$d" _site/; done
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
